<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { level: 2, drag: false };
}
levelFrom(e) {
const r = e.currentTarget.getBoundingClientRect();
const y = (e.clientY - r.top) / r.height * 380;
return Math.max(0, Math.min(4, Math.round((y - 38) / 76)));
}
renderVals() {
const L = this.state.level;
const labels = ["Great", "Good", "Okay", "Tired", "Stressed"];
const row = (i) => ({
pick: () => this.setState({ level: i }),
pressed: i === L ? 'true' : 'false',
color: i === L ? '#8B7CFF' : '#ABA8D8',
weight: i === L ? '700' : '500',
op: i === L ? '1' : '0.55',
scale: i === L ? '1.12' : '1'
});
const c = 38 + L * 76;
return {
r0: row(0), r1: row(1), r2: row(2), r3: row(3), r4: row(4),
label: labels[L],
thumbTop: (c - 16) + 'px',
fillTop: c + 'px',
fillH: (342 - c) + 'px',
down: (e) => this.setState({ drag: true, level: this.levelFrom(e) }),
move: (e) => { if (this.state.drag) this.setState({ level: this.levelFrom(e) }); },
up: () => { if (this.state.drag) this.setState({ drag: false }); }
};
}
}
</script>
